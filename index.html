<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Minhas Finanças</title>

  <!-- PWA: manifesto e ícones (arquivos criados nas próximas etapas) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =========================================================
       TELA 1 – LOGIN (aparece só quando não há usuário logado)
       ========================================================= -->
  <section id="tela-login" class="login" hidden>
    <div class="login-logo">💰</div>
    <h1>Minhas Finanças</h1>

    <form id="form-login" autocomplete="on">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" autocomplete="username" required>

      <label for="login-senha">Senha</label>
      <input id="login-senha" type="password" autocomplete="current-password" required>

      <button type="submit" class="btn btn-primario">Entrar</button>
      <p id="login-erro" class="erro" hidden></p>
    </form>
  </section>


  <!-- =========================================================
       APLICATIVO (aparece depois do login)
       ========================================================= -->
  <div id="app" hidden>

    <header class="topo">
      <h1 id="topo-titulo">Minhas Finanças</h1>
      <button id="btn-sair" type="button" class="topo-btn">Sair</button>
    </header>

    <main>

      <!-- ---------------- TELA 2 – MÊS ---------------- -->
      <section id="tela-mes" class="tela">
        <div class="mes-nav">
          <button id="mes-ant" type="button" class="mes-btn" aria-label="Mês anterior">‹</button>
          <h2 id="mes-titulo">—</h2>
          <button id="mes-prox" type="button" class="mes-btn" aria-label="Próximo mês">›</button>
        </div>

        <div class="card resumo">
          <small>Saldo do mês (só o que já foi pago/recebido)</small>
          <div id="saldo" class="saldo-valor">R$ 0,00</div>

          <div class="totais">
            <div class="total total-entrada">
              Recebido
              <b id="tot-recebido">R$ 0,00</b>
              <small>a receber <span id="tot-a-receber">R$ 0,00</span></small>
            </div>
            <div class="total total-saida">
              Pago
              <b id="tot-pago">R$ 0,00</b>
              <small>a pagar <span id="tot-a-pagar">R$ 0,00</span></small>
            </div>
          </div>

          <div class="previsto">
            <span>Previsto no fim do mês</span>
            <b id="previsto">R$ 0,00</b>
          </div>
        </div>

        <!-- Preenchido pelo app.js: lançamentos agrupados por dia -->
        <div id="lista-lancamentos"></div>
        <p id="lista-vazia" class="vazio" hidden>Nenhum lançamento neste mês.</p>
      </section>


      <!-- ---------------- TELA 3 – NOVO / EDITAR LANÇAMENTO ---------------- -->
      <section id="tela-form" class="tela" hidden>
        <form id="form-lanc" novalidate>
          <input id="lanc-id" type="hidden">

          <div class="segmento" role="radiogroup" aria-label="Tipo">
            <label><input type="radio" name="lanc-tipo" value="entrada"><span>Entrada</span></label>
            <label><input type="radio" name="lanc-tipo" value="saida" checked><span>Saída</span></label>
          </div>

          <label for="lanc-valor">Valor</label>
          <input id="lanc-valor" class="valor" type="text" inputmode="decimal"
                 placeholder="R$ 0,00" autocomplete="off" required>

          <label for="lanc-data">Data</label>
          <input id="lanc-data" type="date" required>

          <label for="lanc-descricao">Descrição</label>
          <input id="lanc-descricao" type="text" maxlength="80" autocomplete="off" required>

          <label>Categoria (opcional)</label>
          <!-- Preenchido pelo app.js com as categorias do tipo escolhido -->
          <div id="lanc-categorias" class="chips"></div>

          <label class="check">
            <input id="lanc-efetivado" type="checkbox">
            <span id="lanc-efetivado-txt">Já paga</span>
          </label>

          <p id="lanc-erro" class="erro" hidden></p>

          <button type="submit" class="btn btn-primario">Salvar</button>
          <button id="btn-excluir" type="button" class="btn btn-perigo" hidden>Excluir</button>
          <button id="btn-cancelar" type="button" class="btn btn-secundario">Cancelar</button>
        </form>
      </section>


      <!-- ---------------- TELA 4 – CATEGORIAS ---------------- -->
      <section id="tela-categorias" class="tela" hidden>

        <form id="form-cat" class="card" novalidate>
          <h3 id="cat-form-titulo">Nova categoria</h3>
          <input id="cat-id" type="hidden">

          <div class="segmento" role="radiogroup" aria-label="Tipo da categoria">
            <label><input type="radio" name="cat-tipo" value="entrada"><span>Entrada</span></label>
            <label><input type="radio" name="cat-tipo" value="saida" checked><span>Saída</span></label>
          </div>

          <div class="linha">
            <input id="cat-emoji" class="emoji" type="text" maxlength="4"
                   placeholder="📦" autocomplete="off" aria-label="Emoji">
            <input id="cat-nome" type="text" maxlength="40"
                   placeholder="Nome" autocomplete="off" aria-label="Nome" required>
          </div>

          <p id="cat-erro" class="erro" hidden></p>

          <button type="submit" class="btn btn-primario">Salvar</button>
          <button id="btn-cat-excluir" type="button" class="btn btn-perigo" hidden>Excluir</button>
          <button id="btn-cat-cancelar" type="button" class="btn btn-secundario" hidden>Cancelar</button>
        </form>

        <div class="card">
          <h3 class="txt-saida">Saídas</h3>
          <div id="lista-cat-saida" class="lista-cat"></div>
        </div>

        <div class="card">
          <h3 class="txt-entrada">Entradas</h3>
          <div id="lista-cat-entrada" class="lista-cat"></div>
        </div>
      </section>

    </main>

    <!-- Menu inferior -->
    <nav class="menu">
      <button type="button" data-tela="mes" class="ativo"><i>📅</i>Mês</button>
      <button type="button" data-tela="form"><i>➕</i>Novo</button>
      <button type="button" data-tela="categorias"><i>🏷️</i>Categorias</button>
    </nav>
  </div>

  <!-- Aviso rápido no rodapé (ex.: "Salvo!") -->
  <div id="aviso" class="aviso" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
